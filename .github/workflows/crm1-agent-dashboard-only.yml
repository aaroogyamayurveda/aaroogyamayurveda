name: CRM1 Agent Dashboard Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crm1/**'
      - 'tests/crm1/agent-dashboard-orders.spec.cjs'
      - '.github/workflows/crm1-agent-dashboard-only.yml'

jobs:
  agent-dashboard:
    name: Agent Dashboard regression only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed CRM1
        run: |
          for i in {1..18}; do
            if curl -fsS --max-time 10 https://aaroogyamayurveda.in/crm1/ >/dev/null; then
              echo "CRM1 is live"
              exit 0
            fi
            echo "Waiting for deployment ($i/18)..."
            sleep 10
          done
          exit 1

      - name: Run Agent Dashboard test only
        env:
          CI: true
          CRM1_BASE_URL: https://aaroogyamayurveda.in
          CRM1_AGENT_EMAIL: ${{ secrets.CRM1_AGENT_EMAIL }}
          CRM1_AGENT_PASSWORD: ${{ secrets.CRM1_AGENT_PASSWORD }}
        run: npx playwright test tests/crm1/agent-dashboard-orders.spec.cjs --config=playwright.config.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm1-agent-dashboard-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
