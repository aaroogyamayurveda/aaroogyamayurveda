name: CRM1 Advanced Reports Only

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm1-advanced-reports-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advanced-reports-only:
    name: Advanced Reports regression only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed CRM1
        run: |
          for i in {1..18}; do
            if curl -fsS --max-time 10 https://aaroogyamayurveda.in/crm1/ >/dev/null; then
              echo "CRM1 is live"
              exit 0
            fi
            echo "Waiting for deployment ($i/18)..."
            sleep 10
          done
          echo "CRM1 deployment did not become reachable"
          exit 1

      - name: Run Advanced Reports regression only
        env:
          CI: true
          CRM1_BASE_URL: https://aaroogyamayurveda.in
          CRM1_DEALER_EMAIL: ${{ secrets.CRM1_DEALER_EMAIL }}
          CRM1_DEALER_PASSWORD: ${{ secrets.CRM1_DEALER_PASSWORD }}
          CRM1_COURIER_EMAIL: ${{ secrets.CRM1_COURIER_EMAIL }}
          CRM1_COURIER_PASSWORD: ${{ secrets.CRM1_COURIER_PASSWORD }}
        run: npx playwright test tests/crm1/advanced-reports-only.spec.cjs --config=playwright.config.cjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm1-advanced-reports-only-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
