name: CRM1 Playwright

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  crm1-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for deployed CRM1
        run: |
          for i in {1..24}; do
            if curl -fsS https://aaroogyamayurveda.in/crm1/ >/dev/null; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Run authenticated role tests
        env:
          CRM1_BASE_URL: https://aaroogyamayurveda.in
          CRM1_SUPER_ADMIN_EMAIL: ${{ secrets.CRM1_SUPER_ADMIN_EMAIL }}
          CRM1_SUPER_ADMIN_PASSWORD: ${{ secrets.CRM1_SUPER_ADMIN_PASSWORD }}
          CRM1_MANAGER_EMAIL: ${{ secrets.CRM1_MANAGER_EMAIL }}
          CRM1_MANAGER_PASSWORD: ${{ secrets.CRM1_MANAGER_PASSWORD }}
          CRM1_AGENT_EMAIL: ${{ secrets.CRM1_AGENT_EMAIL }}
          CRM1_AGENT_PASSWORD: ${{ secrets.CRM1_AGENT_PASSWORD }}
          CRM1_DEALER_EMAIL: ${{ secrets.CRM1_DEALER_EMAIL }}
          CRM1_DEALER_PASSWORD: ${{ secrets.CRM1_DEALER_PASSWORD }}
          CRM1_COURIER_EMAIL: ${{ secrets.CRM1_COURIER_EMAIL }}
          CRM1_COURIER_PASSWORD: ${{ secrets.CRM1_COURIER_PASSWORD }}
        run: npm run test:crm1
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm1-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
