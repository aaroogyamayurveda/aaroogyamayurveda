name: Supabase Keepalive

on:
  schedule:
    # Run every day at 03:15 UTC (08:45 IST)
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database API
        env:
          SUPABASE_URL: https://ielebadardbzmoxantsc.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_0pekrOT6vhYZYQ48wHr7Ag_NPcpobGj
        run: |
          set -e
          echo "Pinging a lightweight public REST resource to create project activity..."
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/crm_followups?select=id&limit=1")
          echo "Supabase REST query returned HTTP $status"
          case "$status" in
            2*) exit 0 ;;
            *) echo "Unexpected HTTP status: $status"; exit 1 ;;
          esac
