name: Supabase Keepalive

on:
  schedule:
    # Run every day at 03:15 UTC (08:45 IST)
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: https://ielebadardbzmoxantsc.supabase.co
        run: |
          set -e
          echo "Pinging Supabase API to create lightweight project activity..."
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SUPABASE_URL/rest/v1/")
          echo "Supabase REST endpoint returned HTTP $status"
          # 2xx/3xx/401/403 all mean the hosted API endpoint was reached.
          case "$status" in
            2*|3*|401|403) exit 0 ;;
            *) echo "Unexpected HTTP status: $status"; exit 1 ;;
          esac
