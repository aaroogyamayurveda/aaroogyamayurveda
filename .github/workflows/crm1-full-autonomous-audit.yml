name: CRM1 Full Autonomous Audit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm1-full-autonomous-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: CRM1 static code/dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Static CRM1 audit
        run: node scripts/crm1-code-audit.cjs | tee crm1-static-audit.txt
      - name: Upload static audit
        uses: actions/upload-artifact@v4
        with:
          name: crm1-static-code-audit
          path: crm1-static-audit.txt
          retention-days: 30

  browser-audit:
    name: CRM1 all-role browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for CURRENT CRM1 deployment
        run: |
          for i in {1..36}; do
            body=$(curl -fsSL --max-time 15 "https://aaroogyamayurveda.in/crm1/advanced-business-layer.js?cb=${GITHUB_SHA}-${i}" || true)
            if echo "$body" | grep -q 'crm1-call-console-duplicate-guard.js'; then
              echo "Live CRM1 contains the current call-console guard from the pushed source."
              exit 0
            fi
            echo "Waiting for current CRM1 deployment ($i/36)..."
            sleep 10
          done
          echo "Timed out waiting for the current CRM1 deployment marker."
          exit 1
      - name: Run full all-role browser audit
        env:
          CI: true
          CRM1_BASE_URL: https://aaroogyamayurveda.in
          CRM1_SUPER_ADMIN_EMAIL: ${{ secrets.CRM1_SUPER_ADMIN_EMAIL }}
          CRM1_SUPER_ADMIN_PASSWORD: ${{ secrets.CRM1_SUPER_ADMIN_PASSWORD }}
          CRM1_MANAGER_EMAIL: ${{ secrets.CRM1_MANAGER_EMAIL }}
          CRM1_MANAGER_PASSWORD: ${{ secrets.CRM1_MANAGER_PASSWORD }}
          CRM1_AGENT_EMAIL: ${{ secrets.CRM1_AGENT_EMAIL }}
          CRM1_AGENT_PASSWORD: ${{ secrets.CRM1_AGENT_PASSWORD }}
          CRM1_DEALER_EMAIL: ${{ secrets.CRM1_DEALER_EMAIL }}
          CRM1_DEALER_PASSWORD: ${{ secrets.CRM1_DEALER_PASSWORD }}
          CRM1_COURIER_EMAIL: ${{ secrets.CRM1_COURIER_EMAIL }}
          CRM1_COURIER_PASSWORD: ${{ secrets.CRM1_COURIER_PASSWORD }}
        run: npx playwright test tests/crm1/full-ui-audit.spec.cjs --config=playwright.config.cjs
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm1-browser-audit-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30
