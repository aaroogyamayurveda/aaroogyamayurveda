name: CRM1 Generate Invoice Branch Test
on:
  workflow_dispatch:
  push:
    branches: [feature/crm1-generate-invoice-v2]
jobs:
  invoice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/crm1-server.log 2>&1 &
      - name: Test Generate Invoice branch UI
        env:
          CRM1_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/crm1/smoke.spec.cjs --config=playwright.config.cjs
