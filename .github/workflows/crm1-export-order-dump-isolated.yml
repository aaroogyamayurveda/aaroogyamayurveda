name: CRM1 Export Order Dump Isolated Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crm1/crm1-export-order-dump.js'
      - 'tests/crm1/export-order-dump-isolated.spec.cjs'
      - '.github/workflows/crm1-export-order-dump-isolated.yml'

permissions:
  contents: read

jobs:
  isolated-export-order-dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated Export Order Dump browser test
        run: npx playwright test tests/crm1/export-order-dump-isolated.spec.cjs --config=playwright.config.cjs --workers=1
      - name: Upload isolated browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm1-export-order-dump-isolated-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
