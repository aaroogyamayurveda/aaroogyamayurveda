name: CRM1 Playwright Fresh

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm1-playwright-fresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm1-live-fresh:
    name: Fresh authenticated CRM1 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed CRM1
        run: |
          for i in {1..18}; do
            if curl -fsS --max-time 10 https://aaroogyamayurveda.in/crm1/ >/dev/null; then
              echo "CRM1 is live"
              exit 0
            fi
            echo "Waiting for deployment ($i/18)..."
            sleep 10
          done
          echo "CRM1 deployment did not become reachable"
          exit 1

      - name: Run authenticated role tests
        env:
          CI: true
          CRM1_BASE_URL: https://aaroogyamayurveda.in
          CRM1_SUPER_ADMIN_EMAIL: ${{ secrets.CRM1_SUPER_ADMIN_EMAIL }}
          CRM1_SUPER_ADMIN_PASSWORD: ${{ secrets.CRM1_SUPER_ADMIN_PASSWORD }}
          CRM1_MANAGER_EMAIL: ${{ secrets.CRM1_MANAGER_EMAIL }}
          CRM1_MANAGER_PASSWORD: ${{ secrets.CRM1_MANAGER_PASSWORD }}
          CRM1_AGENT_EMAIL: ${{ secrets.CRM1_AGENT_EMAIL }}
          CRM1_AGENT_PASSWORD: ${{ secrets.CRM1_AGENT_PASSWORD }}
          CRM1_DEALER_EMAIL: ${{ secrets.CRM1_DEALER_EMAIL }}
          CRM1_DEALER_PASSWORD: ${{ secrets.CRM1_DEALER_PASSWORD }}
          CRM1_COURIER_EMAIL: ${{ secrets.CRM1_COURIER_EMAIL }}
          CRM1_COURIER_PASSWORD: ${{ secrets.CRM1_COURIER_PASSWORD }}
        run: npm run test:crm1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm1-playwright-fresh-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
